name: Claim issues

# Contributors comment "/claim" on an issue before starting work, and "/unclaim" to release it.
# If someone else already holds the issue, the bot replies and tags both people so work isn't duplicated.

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  claim:
    if: >-
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/claim') || startsWith(github.event.comment.body, '/unclaim'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const IN_PROGRESS = 'status: in progress';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const user = context.payload.comment.user.login;
            const body = context.payload.comment.body.trim();
            const assignees = (context.payload.issue.assignees || []).map(a => a.login);

            const reply = (text) =>
              github.rest.issues.createComment({ owner, repo, issue_number, body: text });

            if (body.startsWith('/unclaim')) {
              if (!assignees.includes(user)) {
                return reply(`@${user} you haven't claimed this issue, so there's nothing to release.`);
              }
              await github.rest.issues.removeAssignees({ owner, repo, issue_number, assignees: [user] });
              if (assignees.length === 1) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: IN_PROGRESS }).catch(() => {});
              }
              return reply(`@${user} released this issue. It's open for anyone to \`/claim\`.`);
            }

            // /claim
            if (assignees.includes(user)) {
              return reply(`@${user} you already have this issue.`);
            }
            if (assignees.length > 0) {
              const holders = assignees.map(a => `@${a}`).join(', ');
              return reply(
                `⚠️ @${user}, this issue is already being worked on by ${holders}.\n\n` +
                `To avoid merge conflicts and overwritten work, please don't start on it in parallel. ` +
                `You can:\n` +
                `- coordinate here with ${holders} (split the work, or pair up), or\n` +
                `- ask them to \`/unclaim\` if they've stopped, or\n` +
                `- pick another issue labeled \`good first issue\` or from the current roadmap phase.`
              );
            }

            await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [user] });
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [IN_PROGRESS] });
            return reply(
              `✅ @${user} is now working on this issue.\n\n` +
              `Please open a **draft PR** early (link it with \`Closes #${issue_number}\`) so others can see what files you're touching. ` +
              `Comment \`/unclaim\` if you stop. Claims with no activity for 14 days get a reminder and are released after 21 days.`
            );
