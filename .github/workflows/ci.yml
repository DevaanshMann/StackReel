name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build and verify template JSON Schema
        shell: bash
        run: |
          pnpm --filter @stackreel/template-schema build
          template_schema_path=packages/template-schema/schema/stackreel-template.v1.json
          git show "HEAD:$template_schema_path" | diff -u - "$template_schema_path"

      - name: Upload template JSON Schema
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stackreel-template-schema-v1
          path: packages/template-schema/schema/stackreel-template.v1.json
          if-no-files-found: error

  ios-plan:
    name: ios-plan
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - run: swift test --package-path modules/stackreel-engine/ios
