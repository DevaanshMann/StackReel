name: Changeset check

# Warns when a PR changes a package without adding a changeset (see CONTRIBUTING.md → Changesets).
# This is a reminder only: it never fails, and it isn't a required check. Docs, CI and test-only PRs don't need a changeset.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: changeset-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset-check:
    name: changeset-check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        run: |
          if pnpm changeset status --since=origin/${{ github.base_ref }}; then
            echo "Changeset status OK."
          else
            echo "::warning title=No changeset::This PR changes a package but has no changeset. If it changes a package's behavior or API, run 'corepack pnpm changeset' and commit the file. Docs, CI, test and repo-config changes don't need one."
          fi
